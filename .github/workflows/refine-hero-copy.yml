name: Refine hero copy
on:
  push:
    paths:
      - '.github/workflows/refine-hero-copy.yml'
permissions:
  contents: write
jobs:
  refine:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update hero title and copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('<p class="eyebrow">Music Producer</p>\n        <h1 id="hero-title">Music Producer</h1>', '<p class="eyebrow">Producer · Engineer · Sound Designer</p>\n        <h1 id="hero-title">Music Producer</h1>')
          marker = '/* === Success modal === */'
          css = '''/* Hero title refinement */\n#hero-title { max-width: none; white-space: nowrap; font-size: clamp(2.1rem, 9vw, 9.5rem); }\n\n'''
          if '/* Hero title refinement */' not in s:
              s = s.replace(marker, css + marker, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/refine-hero-copy.yml
          git commit -m 'Refine hero title layout'
          git push
