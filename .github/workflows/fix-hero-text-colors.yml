name: Fix hero text colors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update hero text colors
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          text = path.read_text(encoding='utf-8')

          replacements = {
              '.hero-copy { max-width: 500px; margin: 28px 0 34px; color: var(--muted); font-size: clamp(1rem, 2vw, 1.25rem); }':
              '.hero-copy { max-width: 500px; margin: 28px 0 34px; color: #e2e2ec; font-size: clamp(1rem, 2vw, 1.25rem); }',
              '.vertical-note { position: absolute; z-index: 2; right: 24px; bottom: 90px; margin: 0; color: var(--muted); font-size: .62rem; letter-spacing: .2em; writing-mode: vertical-rl; }':
              '.vertical-note { position: absolute; z-index: 2; right: 24px; bottom: 90px; margin: 0; color: #d0d0dd; font-size: .62rem; letter-spacing: .2em; writing-mode: vertical-rl; }',
          }

          for old, new in replacements.items():
              if old not in text:
                  raise SystemExit(f'Expected CSS rule not found: {old}')
              text = text.replace(old, new, 1)

          marker = '.eyebrow { margin: 0 0 18px; color: var(--signal); font-size: .72rem; font-weight: 700; letter-spacing: .18em; text-transform: uppercase; }'
          hero_rule = marker + '\n.hero .eyebrow { color: #b8b3ff; }'
          if marker not in text:
              raise SystemExit('Expected eyebrow CSS rule not found')
          text = text.replace(marker, hero_rule, 1)

          path.write_text(text, encoding='utf-8')
          PY

      - name: Remove temporary workflow and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/fix-hero-text-colors.yml
          git add index.html
          git diff --cached --check
          git commit -m "Improve hero text readability"
          git push
