name: Final tidy
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  tidy:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove remaining redundant pieces
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          s = s.replace('          <span class="track-visualizer" aria-hidden="true"><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span><span style="--level: 0; --active: 0;"></span></span>\n', '')
          s = s.replace('.hero-photo img { object-fit: fill; transform: none; filter: none; }\n', '')
          s = s.replace('@media (min-width: 821px) {\n  .hero-photo img { object-fit: fill; transform: none; }\n}\n\n', '')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          assert s.count('<style>') == 1 and s.count('</style>') == 1
          assert s.count('<script>') == 1 and s.count('</script>') == 1
          assert 'class="player-energy"' not in s
          assert 'class="track-status"' not in s
          assert 'class="track-visualizer"' not in s
          assert 'const trackVisualizer = document.createElement' in s
          assert '#hero-title' in s and 'white-space: nowrap' in s
          assert 'min-height: 100svh' in s
          assert 'href="./assets/c1.gif"' in s
          assert 'https://api.web3forms.com/submit' in s
          print(f'index.html: {len(s)} bytes, {len(s.splitlines())} lines')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Finish index.html cleanup'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/final-tidy.yml
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Remove temporary tidy workflow'
          git push
