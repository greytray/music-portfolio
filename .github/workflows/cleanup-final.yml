name: Cleanup final
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Clean redundant markup
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          marker = '          <span class="track-visualizer" aria-hidden="true"><span style="--level: 0; --active: 0;">'
          start = s.find(marker)
          if start != -1:
              end = s.find('</span></span></button>', start)
              if end != -1:
                  end += len('</span></span></button>')
                  # Remove only the static visualizer attached to the first track; JS creates it at runtime.
                  s = s[:start] + '</button>' + s[end:]
          s = s.replace('.hero-photo img { object-fit: fill; transform: none; filter: none; }\n', '')
          s = s.replace('@media (min-width: 821px) {\n  .hero-photo img { object-fit: fill; transform: none; }\n}\n\n', '')
          p.write_text(s)
          PY
      - name: Validate
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s = Path('index.html').read_text()
          assert 'const trackVisualizer = document.createElement' in s
          assert 'min-height: 100svh' in s
          assert '#hero-title' in s and 'white-space: nowrap' in s
          assert 'href="./assets/c1.gif"' in s
          assert 'https://api.web3forms.com/submit' in s
          assert s.count('style="--level: 0; --active: 0;"') == 0
          print('Validation passed')
          PY
      - name: Commit cleanup
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Clean redundant index markup'
          git push
