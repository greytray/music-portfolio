name: Update hero copy

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update hero copy
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          old = '''        <p class="eyebrow">Producer · Engineer · Sound Designer</p>
        <h1 id="hero-title">EKO</h1>
        <p class="hero-copy">Cinematic sound. Heavy drums. Records built to leave a mark.</p>'''
          new = '''        <p class="eyebrow">Music Producer</p>
        <h1 id="hero-title">Music Producer</h1>
        <p class="hero-copy">Beats, Mixing &amp; Vocal Production<br>Focused on clean, impactful sound with fast delivery</p>'''
          if old not in s:
              raise SystemExit('Expected hero copy was not found')
          p.write_text(s.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/update-hero-copy.yml
          git add index.html
          git diff --cached --check
          git commit -m "Update hero copy"
          git push
