<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pro Music Production Services</title>
    <style>
        body { font-family: sans-serif; background: #121212; color: #fff; padding: 40px; text-align: center; }
        .card { background: #1e1e1e; padding: 20px; border-radius: 8px; margin: 20px auto; max-width: 500px; }
        .btn { display: inline-block; background: #0070f3; color: white; padding: 10px 20px; text-decoration: none; border-radius: 5px; font-weight: bold; margin-top: 10px; }
        iframe { width: 100%; max-width: 500px; border: none; height: 166px; margin: 15px 0; }
    </style>
</head>
<body>

    <h1>Welcome to My Production Studio</h1>
    <p>Premium beats, mixing, and mastering services.</p>

    <!-- Music Portfolio Section -->
    <div class="card">
        <h2>Listen to My Work</h2>
        <!-- Replace the src URL below with your own SoundCloud embed link later -->
        <iframe src="https://soundcloud.com"></iframe>
    </div>

    <!-- Payment Service Section -->
    <div class="card">
        <h2>Mix & Master Service ($50)</h2>
        <p>Get your track sounding radio-ready. Global checkout via secure link.</p>
        <!-- Replace # with your PayPal or Stripe link later -->
        <a href="#" class="btn">Order Mix & Master</a>
    </div>

    <!-- Contact Form Section -->
    <div class="card">
        <h2>Book a Session / Contact Me</h2>
        <!-- Replace # with your Formspree or Web3Forms link later -->
        <form action="#" method="POST">
            <input type="text" placeholder="Your Name" required style="width:90%; padding:8px; margin:5px 0;"><br>
            <input type="email" placeholder="Your Email" required style="width:90%; padding:8px; margin:5px 0;"><br>
            <textarea placeholder="Tell me about your project..." required style="width:90%; padding:8px; margin:5px 0; height:80px;"></textarea><br>
            <button type="submit" class="btn" style="border:none; cursor:pointer;">Send Message</button>
        </form>
    </div>

</body>
</html>
