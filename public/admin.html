<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Site Error">
  <title>This site can’t be reached</title>
  <style id="fake-chrome-error-styles">
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #ffffff;
      color: #202124;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      box-sizing: border-box;
    }
    *, *::before, *::after {
      box-sizing: inherit;
    }
    .chrome-error-wrapper {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      align-items: center;
      background-color: #ffffff;
      padding: 16vh 24px 60px 24px;
      box-sizing: border-box;
    }
    @media (max-width: 768px) {
      .chrome-error-wrapper {
        padding: 12vh 20px 40px 20px;
      }
    }
    .chrome-error-container {
      max-width: 560px;
      width: 100%;
      margin: 0 auto;
      text-align: left;
    }
    .sad-file-wrapper {
      position: relative;
      margin-bottom: 34px;
      display: inline-block;
      user-select: none;
      -webkit-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      cursor: default;
    }
    #sad-file-icon {
      display: block;
      width: 49.5px;
      height: 57px;
      cursor: default;
      image-rendering: -webkit-optimize-contrast;
      image-rendering: crisp-edges;
      shape-rendering: crispEdges;
      pointer-events: none;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      transition: opacity 0.15s ease;
    }
    .sad-file-shield {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      pointer-events: auto;
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      -webkit-user-drag: none;
      -webkit-touch-callout: none;
      z-index: 10;
    }
    .sad-file-wrapper:active #sad-file-icon {
      opacity: 0.85;
    }
    .chrome-error-title {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 24px;
      font-weight: 500;
      line-height: 1.33;
      color: #202124;
      margin: 0 0 16px 0;
      letter-spacing: -0.2px;
      -webkit-font-smoothing: antialiased;
    }
    .chrome-error-message {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      color: #5f6368;
      margin: 0 0 32px 0;
      word-break: break-word;
      -webkit-font-smoothing: antialiased;
    }
    .chrome-error-code {
      font-family: Arial, Helvetica, sans-serif;
      font-size: 12px;
      font-weight: 500;
      color: #5f6368;
      letter-spacing: 0.25px;
      margin: 0;
      user-select: all;
      -webkit-font-smoothing: antialiased;
    }
    .chrome-button-row {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      margin-top: 36px;
    }
    .chrome-btn-back {
      background-color: #ffffff;
      color: #5F6368;
      border: 1px solid #5F6368;
      border-radius: 100px;
      padding: 7px 18px;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.4;
      cursor: pointer;
      font-family: Arial, Helvetica, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: geometricPrecision;
      display: inline-flex;
      justify-content: center;
      align-items: center;
      text-align: center;
      box-shadow: none;
      outline: none;
      transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease;
    }
    .chrome-btn-back:hover {
      background-color: #f8f9fa;
      border-color: #202124;
      color: #202124;
      box-shadow: none;
    }
    .chrome-btn-back:active {
      background-color: #f1f3f4;
    }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Dela+Gothic+One&family=Kanit:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,700&family=Work+Sans:wght@400;500;600;700&display=swap">
</head>
<body class="fake-error-body">
  <div id="fake-chrome-error-screen" class="chrome-error-wrapper">
    <div class="chrome-error-container">
      <div class="sad-file-wrapper" id="sad-file-trigger" oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;" title="">
        <!-- Using icon from assets/icons/sad_file_fixed.svg -->
        <img id="sad-file-icon" src="/assets/icons/sad_file_fixed.svg" alt="" width="50" height="57" draggable="false" oncontextmenu="return false;" ondragstart="return false;" />
        <div id="sad-file-shield" class="sad-file-shield" oncontextmenu="return false;" ondragstart="return false;" onselectstart="return false;"></div>
      </div>
      <h1 class="chrome-error-title">This site can’t be reached</h1>
      <p class="chrome-error-message">The webpage at https://pages.dev might be temporarily down or it may have moved permanently to a new web address.</p>
      <p class="chrome-error-code">ERR_ADDRESS_UNREACHABLE</p>
      <div class="chrome-button-row">
        <button type="button" class="chrome-btn-back" id="chrome-back-btn" onclick="handleChromeBack(event)">Back</button>
      </div>
    </div>
  </div>
  <script>
    function handleChromeBack(event) {
      if (event) {
        event.preventDefault();
        event.stopPropagation();
      }
      if (document.referrer && document.referrer !== window.location.href) {
        try {
          var refUrl = new URL(document.referrer);
          if (refUrl.origin === window.location.origin) {
            window.location.replace(document.referrer);
            return;
          }
        } catch (_) {}
      }
      if (window.history && window.history.length > 1) {
        window.history.back();
        setTimeout(function() {
          window.location.href = '/';
        }, 250);
      } else {
        window.location.href = '/';
      }
    }
    window.handleChromeBack = handleChromeBack;
  </script>
  <script type="module" src="/src/admin/adminEntry.js"></script>
</body>
</html>
